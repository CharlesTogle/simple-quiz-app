<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="refresh" content="0;url=quiz.html" />
  <title>Redirecting...</title>
</head>
<body>
  <script>
    const customData = localStorage.getItem('customABQuiz');
    if (customData) {
      localStorage.setItem('customQuiz', customData);
      localStorage.removeItem('customABQuiz');
    }
    const params = window.location.search;
    window.location.replace('quiz.html' + params);
  </script>
  <p>Redirecting to unified quiz... <a href="quiz.html">Click here</a> if not redirected.</p>
</body>
</html>
